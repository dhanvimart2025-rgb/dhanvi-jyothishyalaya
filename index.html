<!doctype html>
<html lang="te"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#21133f"><link rel="manifest" href="manifest.json"><title>Dhanvi Jyothishyalaya Panchangam</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Telugu:wght@400;500;600;700;800&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.19/astronomy.browser.min.js"></script>
<style>
:root{--night:#21133f;--purple:#67429b;--gold:#e7bd70;--cream:#fff8e9;--bg:#f7f3fb;--ink:#28213b;--muted:#77718b;--line:#eee8f5;--green:#16865d;--red:#bd5364}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#f8f5ff,#fffaf0);font-family:'Noto Sans Telugu',Inter,system-ui,sans-serif;color:var(--ink)}.app{max-width:760px;margin:auto;padding:14px 13px 40px}.mast{background:linear-gradient(120deg,#21133f,#56368d 70%,#8057a9);color:#fff;border-radius:23px;padding:20px;box-shadow:0 12px 30px #38205d25}.brand{display:flex;align-items:center;gap:12px}.om{width:48px;height:48px;border-radius:15px;background:linear-gradient(145deg,#f5d78f,#c28b3e);display:grid;place-items:center;color:#45275f;font-size:28px;font-weight:900}.mast h1{margin:0;color:#ffe3a4;font-size:20px}.mast p{margin:4px 0 0;color:#e6d9f7;font-size:12px}.tag{text-align:center;color:#f8e8c7;font-size:12px;margin:15px 0 0}.panel{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;margin-top:14px;box-shadow:0 10px 30px #301c520d}.panel h2{font-size:18px;margin:0 0 5px}.sub{font-size:12px;color:var(--muted);margin:0 0 15px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;font-size:12px;font-weight:700;color:#655b79;margin-bottom:6px}.field input{width:100%;padding:13px;border:1px solid #e6e0ee;border-radius:12px;background:#fdfcff;font:inherit;font-size:14px;color:var(--ink)}.wide{grid-column:1/-1}.primary{border:0;border-radius:13px;background:linear-gradient(110deg,#56368d,#8b5cb2);color:#fff;padding:14px 18px;font:inherit;font-size:14px;font-weight:800;cursor:pointer;width:100%;margin-top:13px;box-shadow:0 7px 16px #65478e2b}.secondary{border:1px solid #e6dcef;background:#fff;color:#5c467b;border-radius:12px;padding:11px 14px;font:inherit;font-size:12px;font-weight:700;cursor:pointer;margin-top:8px}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:12px}.info{background:#fbf9ff;border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0}.info small{display:block;color:#827994;font-size:11px;margin-bottom:5px}.info b{font-size:15px;overflow-wrap:anywhere}.hero{background:linear-gradient(120deg,#fff5df,#f4eaff);border:1px solid #f0e1c4;border-radius:16px;padding:15px;margin-bottom:12px}.hero small{color:#82633b;font-size:11px}.hero strong{display:block;font-size:22px;color:#4e3473;margin-top:5px}.table{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}.table th,.table td{text-align:left;padding:11px 8px;border-bottom:1px solid var(--line);vertical-align:top}.table th{color:#766b89;font-weight:600;width:45%}.table td{font-weight:700;text-align:right}.sectionTitle{font-size:16px;margin:20px 0 6px}.notice{background:#fff6df;border:1px solid #f0dfb8;color:#765b2b;border-radius:13px;padding:12px;font-size:11px;line-height:1.7;margin-top:13px}.error{color:var(--red)}.foot{text-align:center;color:#9a92a8;font-size:10px;margin:18px 0}@media(max-width:520px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}.mast h1{font-size:17px}.panel{padding:15px}}
</style></head><body><main class="app"><header class="mast"><div class="brand"><div class="om">ॐ</div><div><h1>DHANVI JYOTHISHYALAYA</h1><p>ధన్వి జ్యోతిష్యాలయం</p></div></div><div class="tag">రోజువారీ తెలుగు పంచాంగం • Daily Telugu Panchangam</div></header>
<section class="panel"><h2>పంచాంగం తెలుసుకోండి</h2><p class="sub">తేదీ, ప్రదేశం నమోదు చేసి ఆ రోజు వివరాలు పొందండి.</p><div class="grid"><div class="field"><label for="date">తేదీ / Date</label><input id="date" type="date"></div><div class="field"><label for="place">ప్రదేశం / Place</label><input id="place" value="Hyderabad, Telangana" placeholder="ఉదా: Hyderabad"></div></div><button class="primary" id="go">పంచాంగం చూడండి</button><div id="status" class="sub" style="margin:10px 0 0"></div></section>
<section class="panel" id="result" hidden></section><div class="foot">DHANVI JYOTHISHYALAYA · Lahiri Ayanamsa · Indian Standard Time</div></main>
<script>
const $=id=>document.getElementById(id);const te=true;const A=()=>{if(!window.Astronomy)throw Error('Astronomy Engine లోడ్ కాలేదు. Internet కనెక్షన్ చూసి మళ్లీ ప్రయత్నించండి.');return window.Astronomy};
const nak=['అశ్విని','భరణి','కృత్తిక','రోహిణి','మృగశిర','ఆరుద్ర','పునర్వసు','పుష్యమి','ఆశ్లేష','మఖ','పుబ్బ','ఉత్తర','హస్త','చిత్త','స్వాతి','విశాఖ','అనూరాధ','జ్యేష్ఠ','మూల','పూర్వాషాఢ','ఉత్తరాషాఢ','శ్రవణం','ధనిష్ఠ','శతభిషం','పూర్వాభాద్ర','ఉత్తరాభాద్ర','రేవతి'];
const tithis=['పాడ్యమి','విదియ','తదియ','చవితి','పంచమి','షష్ఠి','సప్తమి','అష్టమి','నవమి','దశమి','ఏకాదశి','ద్వాదశి','త్రయోదశి','చతుర్దశి','పౌర్ణమి'];
const years=['ప్రభవ','విభవ','శుక్ల','ప్రమోదూత','ప్రజోత్పత్తి','ఆంగీరస','శ్రీముఖ','భావ','యువ','ధాత','ఈశ్వర','బహుధాన్య','ప్రమాథి','విక్రమ','వృష','చిత్రభాను','స్వభాను','తారణ','పార్థివ','వ్యయ','సర్వజిత్','సర్వధారి','విరోధి','వికృతి','ఖర','నందన','విజయ','జయ','మన్మథ','దుర్ముఖి','హేవిళంబి','విళంబి','వికారీ','శార్వరి','ప్లవ','శుభకృత్','శోభకృత్','క్రోధి','విశ్వావసు','పరాభవ','ప్లవంగ','కీలక','సౌమ్య','సాధారణ','విరోధికృత్','పరీధావి','ప్రమాదీచ','ఆనంద','రాక్షస','నల','పింగళ','కాళయుక్తి','సిద్ధార్థి','రౌద్రి','దుర్మతి','దుందుభి','రుధిరోద్గారి','రక్తాక్షి','క్రోధన','క్షయ'];
const days=['ఆదివారం','సోమవారం','మంగళవారం','బుధవారం','గురువారం','శుక్రవారం','శనివారం'];const norm=x=>(x%360+360)%360;const localDate=s=>new Date(s+'T12:00:00+05:30');const fmt=d=>d?new Intl.DateTimeFormat('te-IN',{hour:'2-digit',minute:'2-digit',hour12:true,timeZone:'Asia/Kolkata'}).format(d):'ఆ రోజు లభ్యం కాలేదు';
function ayan(d){let y=d.getUTCFullYear()+(d.getUTCMonth()+d.getUTCDate()/31)/12;return 23.85675+(y-2000)*50.290966/3600}function sun(d){return A().SunPosition(d).elon}function moon(d){return A().EclipticGeoMoon(d).lon}function sid(d){return {s:norm(sun(d)-ayan(d)),m:norm(moon(d)-ayan(d))}}
function nextBoundary(fn,step,date){let lo=new Date(date.getTime()),v=norm(fn(lo)),target=(Math.floor(v/step)+1)*step;let hi=new Date(lo.getTime()+36*3600000);for(let i=0;i<42;i++){let mid=new Date((lo.getTime()+hi.getTime())/2),val=norm(fn(mid));let passed=target>=360?val<step:val>=target;if(passed)hi=mid;else lo=mid;}return hi;}
async function geocode(q){let u='https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(q)+'&count=1&language=en&format=json';let r=await fetch(u);if(!r.ok)throw Error('ప్రదేశాన్ని వెతకలేకపోయింది. నగరం పేరు Englishలో ఇవ్వండి.');let j=await r.json();if(!j.results?.length)throw Error('ఈ ప్రదేశం దొరకలేదు. నగరం పేరు Englishలో ఇవ్వండి.');return j.results[0]}
function yearName(date){let y=date.getFullYear(),idx=(y-1987)%60;if(idx<0)idx+=60;let ugadi=new Date(y,2,22);if(date<ugadi)idx=(idx+59)%60;return years[idx]}
function riseSet(body,obs,start,dir){try{let a=A();return a.SearchRiseSet(body,obs,dir,new a.AstroTime(start),1)?.date||null}catch(e){return null}}
function card(label,val){return `<div class="info"><small>${label}</small><b>${val}</b></div>`}function row(a,b){return `<tr><th>${a}</th><td>${b}</td></tr>`}
$('date').value=new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Kolkata'});
$('go').onclick=async()=>{let out=$('result'),status=$('status');out.hidden=false;out.innerHTML='';status.textContent='ప్రదేశం, ఖగోళ వివరాలు లెక్కిస్తున్నాం…';$('go').disabled=true;try{let dateStr=$('date').value;if(!dateStr)throw Error('దయచేసి తేదీ ఎంచుకోండి.');let place=await geocode($('place').value.trim());let lat=place.latitude,lon=place.longitude,d=localDate(dateStr),a=A(),sm=sid(d),diff=norm(sm.m-sm.s),tn=Math.floor(diff/12),ni=Math.floor(sm.m/(360/27)),weekday=d.getDay(),obs=new a.Observer(lat,lon,0),start=new Date(d.getFullYear(),d.getMonth(),d.getDate(),0,0,0);let noon=new Date(start.getTime()+12*3600000);let sr=riseSet(a.Body.Sun,obs,start,1),ss=riseSet(a.Body.Sun,obs,noon,1),mr=riseSet(a.Body.Moon,obs,start,1),tEnd=nextBoundary(x=>norm(moon(x)-sun(x)),12,d),nEnd=nextBoundary(x=>norm(moon(x)-ayan(x)),360/27,d);let paksha=tn<15?'శుక్ల పక్షం':'కృష్ణ పక్షం',tithi=tn===14?'పౌర్ణమి':tn===29?'అమావాస్య':tithis[tn%15],nakName=nak[ni];let rahuPart=[7,1,6,4,5,3,2][weekday],dayMs=ss&&sr?ss-sr:0,rahuStart=sr&&dayMs?new Date(sr.getTime()+dayMs*rahuPart/8):null,rahuEnd=sr&&dayMs?new Date(sr.getTime()+dayMs*(rahuPart+1)/8):null;let abhStart=sr&&ss?new Date((sr.getTime()+ss.getTime())/2-(ss-sr)/30):null,abhEnd=sr&&ss?new Date((sr.getTime()+ss.getTime())/2+(ss-sr)/30):null;let dateLabel=new Intl.DateTimeFormat('te-IN',{dateStyle:'full',timeZone:'Asia/Kolkata'}).format(d);out.innerHTML=`<div class="hero"><small>రోజువారీ పంచాంగం · ${dateLabel}</small><strong>${tithi} · ${nakName}</strong><span>${paksha} · ${days[weekday]}</span></div><div class="cards">${card('తెలుగు సంవత్సరం',yearName(d))}${card('వారం',days[weekday])}${card('తిథి',tithi+' ('+paksha+')')}${card('నక్షత్రం',nakName)}${card('తిథి ముగింపు',fmt(tEnd))}${card('నక్షత్రం ముగింపు',fmt(nEnd))}</div><h3 class="sectionTitle">సూర్య చంద్ర సమయాలు</h3><div class="cards">${card('సూర్యోదయం',fmt(sr))}${card('సూర్యాస్తమయం',fmt(ss))}${card('చంద్రోదయం',fmt(mr))}</div><h3 class="sectionTitle">శుభ ఘడియలు & అశుభ కాలం</h3><table class="table">${row('అభిజిత్ ముహూర్తం',abhStart&&abhEnd?fmt(abhStart)+' – '+fmt(abhEnd):'లభ్యం కాలేదు')}${row('రాహుకాలం',rahuStart&&rahuEnd?fmt(rahuStart)+' – '+fmt(rahuEnd):'లెక్కించలేకపోయాం')}</table><div class="notice">ప్రదేశం: ${place.name}, ${place.admin1||''}, ${place.country||''} · స్థానిక అక్షాంశం ${lat.toFixed(3)}, రేఖాంశం ${lon.toFixed(3)}. <br>గమనిక: తిథి, నక్షత్రం, సూర్య/చంద్ర సమయాలు ఖగోళ గణనల ఆధారంగా అంచనా. తెలుగు సంవత్సరం ఉగాది తేదీ సరళ అంచనాతో చూపబడింది. అభిజిత్ ముహూర్తం సాధారణ పగటి మధ్యకాలం ఆధారంగా మాత్రమే; పూర్తి శుభ ముహూర్త నిర్ణయం కాదు. పూజలు/ముఖ్య కార్యాలకు స్థానిక ప్రామాణిక దృక్ పంచాంగంతో ధృవీకరించండి.</div>`;status.textContent='లెక్కింపు పూర్తయింది';}catch(e){status.textContent=e.message;out.innerHTML='<div class="notice error">'+e.message+'</div>';}finally{$('go').disabled=false;}};
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
